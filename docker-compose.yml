services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wiki_builder_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_NAME: WikiBuilderAPI
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ""
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: wiki_builder
      DB_USERNAME: wiki
      DB_PASSWORD: wiki
      CACHE_STORE: file
      SESSION_DRIVER: file
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "composer install --no-interaction
      && php artisan key:generate --force
      && php artisan migrate:fresh --seed --force
      && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    container_name: wiki_builder_db
    environment:
      MYSQL_DATABASE: wiki_builder
      MYSQL_USER: wiki
      MYSQL_PASSWORD: wiki
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./dump:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
