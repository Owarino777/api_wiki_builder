services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: wiki_builder
      DB_USERNAME: wiki
      DB_PASSWORD: wiki
      INSTALL_COMPOSER_DEPENDENCIES: "true"
      GENERATE_APP_KEY: "true"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "${SEED_DATABASE:-false}"
      BOOTSTRAP_BO7_MODE: "${BOOTSTRAP_BO7_MODE:-live}"
      BOOTSTRAP_BO7_SOURCE: "${BOOTSTRAP_BO7_SOURCE:-prefer-snapshot}"
      BOOTSTRAP_BO7_FORCE: "${BOOTSTRAP_BO7_FORCE:-false}"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$connection = @fsockopen('127.0.0.1', 9000); exit($$connection ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wiki_builder
      MYSQL_USER: wiki
      MYSQL_PASSWORD: wiki
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol", "tcp", "-h", "127.0.0.1", "-P", "3306", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  vendor_data:
