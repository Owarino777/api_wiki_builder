services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    environment:
      APP_NAME: WikiBuilderAPI
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://api-wiki.192.168.56.10.sslip.io
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_US
      APP_MAINTENANCE_DRIVER: file
      BCRYPT_ROUNDS: "12"
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: wiki_builder
      DB_USERNAME: wiki
      DB_PASSWORD: wiki
      SESSION_DRIVER: file
      SESSION_LIFETIME: "120"
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: null
      SESSION_SECURE_COOKIE: "false"
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      MAIL_MAILER: log
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: "2525"
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: WikiBuilderAPI
      VITE_APP_NAME: WikiBuilderAPI
      INSTALL_COMPOSER_DEPENDENCIES: "false"
      GENERATE_APP_KEY: "true"
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "false"
      BOOTSTRAP_BO7_MODE: live
      BOOTSTRAP_BO7_SOURCE: prefer-snapshot
      BOOTSTRAP_BO7_FORCE: "false"
      CODMUNITY_REQUEST_TIMEOUT: "120"
      CODMUNITY_CONNECT_TIMEOUT: "15"
      CODMUNITY_RETRY_ATTEMPTS: "3"
      CODMUNITY_RETRY_SLEEP_MS: "500"
    volumes:
      - api_wiki_storage:/var/www/html/storage
      - api_wiki_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$connection = @fsockopen('127.0.0.1', 9000); exit($connection ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wiki_builder
      MYSQL_USER: wiki
      MYSQL_PASSWORD: wiki
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - api_wiki_db:/var/lib/mysql
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol", "tcp", "-h", "127.0.0.1", "-P", "3306", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  api_wiki_db:
  api_wiki_storage:
  api_wiki_cache: